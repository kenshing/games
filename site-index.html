<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>games · 聚会小游戏合集</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: radial-gradient(ellipse at top, #2d1b4e 0%, #1a0b2e 45%, #0d0618 100%);
        color: #f3e8ff;
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 0.25rem;
      }
      p.sub {
        color: #c084fc;
        margin-bottom: 2.5rem;
      }
      a.game {
        display: block;
        width: 16rem;
        margin: 0.5rem auto;
        padding: 1.25rem;
        border: 1px solid rgba(217, 70, 239, 0.4);
        border-radius: 1.25rem;
        background: rgba(217, 70, 239, 0.1);
        color: #f0abfc;
        text-decoration: none;
        font-size: 1.35rem;
        font-weight: 700;
        transition: all 0.2s;
      }
      a.game:hover {
        transform: translateY(-3px);
        background: rgba(217, 70, 239, 0.2);
        box-shadow: 0 8px 24px rgba(168, 85, 247, 0.35);
      }
      a.game small {
        display: block;
        margin-top: 0.4rem;
        font-size: 0.8rem;
        font-weight: 400;
        color: #c084fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🎮 games</h1>
      <p class="sub">聚会小游戏合集 · 点开即玩</p>
      <a class="game" href="./witch-poison/">🧪 女巫的毒药<small>藏毒 · 轮喝 · 惩罚轮盘</small></a>
      <a class="game" href="./landlord-fight/">🃏 满意斗地主<small>叫分 · 出牌 · AI对战</small></a>
    </main>
  </body>
</html>
