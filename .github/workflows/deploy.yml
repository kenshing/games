name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'witch-poison/**'
      - 'landlord-fight/**'
      - 'site-index.html'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            witch-poison/package-lock.json
            landlord-fight/package-lock.json

      - name: Build witch-poison
        working-directory: witch-poison
        run: |
          npm ci
          npm run build

      - name: Build landlord-fight
        working-directory: landlord-fight
        run: |
          npm ci
          npm run build

      # 站点结构：根目录是游戏目录页，每个游戏一个子路径
      # _site/
      #   index.html          ← 游戏目录首页
      #   witch-poison/       ← 女巫的毒药
      #   landlord-fight/     ← 满意斗地主
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r witch-poison/dist _site/witch-poison
          cp -r landlord-fight/dist _site/landlord-fight
          cp site-index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
